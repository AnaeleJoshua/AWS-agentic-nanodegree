AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lambda tools and IAM roles for the restaurant recommendation agent exercise
  (Amazon Bedrock AgentCore managed harness + AgentCore Gateway).

Resources:

  # ---------------------------------------------------------------------------
  # Execution role for the three tool Lambdas (CloudWatch Logs only).
  # ---------------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  GetCuisinesFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-get-cuisines'
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 15
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json

          RESTAURANTS = [
              {"id": "r1", "name": "Trattoria Bella", "cuisine": "Italian",  "rating": 4.6},
              {"id": "r2", "name": "Osteria Romana",  "cuisine": "Italian",  "rating": 4.4},
              {"id": "r3", "name": "Sakura Garden",   "cuisine": "Japanese", "rating": 4.7},
              {"id": "r4", "name": "Ramen Yuki",      "cuisine": "Japanese", "rating": 4.9},
              {"id": "r5", "name": "El Mercado",      "cuisine": "Mexican",  "rating": 4.3},
              {"id": "r6", "name": "Spice Route",     "cuisine": "Indian",   "rating": 4.6},
              {"id": "r7", "name": "Le Bistro",       "cuisine": "French",   "rating": 4.8},
              {"id": "r8", "name": "The Grill House", "cuisine": "American", "rating": 4.2},
          ]


          def tool_name(context):
              """The AgentCore Gateway sends the name of the tool being called
              (namespaced as "<targetName>___<toolName>") in the Lambda client context.
              """
              cc = getattr(context, "client_context", None)
              custom = getattr(cc, "custom", None) or {}
              return custom.get("bedrockAgentCoreToolName", "")


          def lambda_handler(event, context):
              # The AgentCore Gateway invokes this Lambda with the TOOL ARGUMENTS as the
              # event itself — a plain dict ({} for this no-argument tool). This is NOT
              # the old Bedrock Agents action-group envelope.
              print(f"tool={tool_name(context)} event={json.dumps(event)}")  # CloudWatch Logs

              cuisines = sorted({r["cuisine"] for r in RESTAURANTS})

              # Whatever this function returns is serialized back to the agent as the
              # tool result — no response envelope needed.
              return {"cuisines": cuisines}

  SearchRestaurantsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-search-restaurants'
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 15
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json

          RESTAURANTS = [
              {"id": "r1", "name": "Trattoria Bella", "cuisine": "Italian",  "rating": 4.6},
              {"id": "r2", "name": "Osteria Romana",  "cuisine": "Italian",  "rating": 4.4},
              {"id": "r3", "name": "Sakura Garden",   "cuisine": "Japanese", "rating": 4.7},
              {"id": "r4", "name": "Ramen Yuki",      "cuisine": "Japanese", "rating": 4.9},
              {"id": "r5", "name": "El Mercado",      "cuisine": "Mexican",  "rating": 4.3},
              {"id": "r6", "name": "Spice Route",     "cuisine": "Indian",   "rating": 4.6},
              {"id": "r7", "name": "Le Bistro",       "cuisine": "French",   "rating": 4.8},
              {"id": "r8", "name": "The Grill House", "cuisine": "American", "rating": 4.2},
          ]


          def tool_name(context):
              """The AgentCore Gateway sends the name of the tool being called
              (namespaced as "<targetName>___<toolName>") in the Lambda client context.
              """
              cc = getattr(context, "client_context", None)
              custom = getattr(cc, "custom", None) or {}
              return custom.get("bedrockAgentCoreToolName", "")


          def lambda_handler(event, context):
              # The AgentCore Gateway invokes this Lambda with the TOOL ARGUMENTS as the
              # event itself — a plain dict such as {"cuisine": "Italian"}. This is NOT
              # the old Bedrock Agents action-group envelope.
              print(f"tool={tool_name(context)} event={json.dumps(event)}")  # CloudWatch Logs

              cuisine = str((event or {}).get("cuisine") or "").strip().lower()

              if cuisine:
                  matches = [r for r in RESTAURANTS if r["cuisine"].lower() == cuisine]
                  if not matches:
                      result = {"error": f"No {cuisine.title()} restaurants found."}
                  else:
                      result = {"restaurants": matches}
              else:
                  result = {"restaurants": RESTAURANTS}

              # Whatever this function returns is serialized back to the agent as the
              # tool result — no response envelope needed.
              return result

  GetAvailabilityFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-get-availability'
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 15
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json

          AVAILABILITY = {
              "r1": True,
              "r2": False,
              "r3": True,
              "r4": False,
              "r5": True,
              "r6": True,
              "r7": False,
              "r8": True,
          }


          def tool_name(context):
              """The AgentCore Gateway sends the name of the tool being called
              (namespaced as "<targetName>___<toolName>") in the Lambda client context.
              """
              cc = getattr(context, "client_context", None)
              custom = getattr(cc, "custom", None) or {}
              return custom.get("bedrockAgentCoreToolName", "")


          def lambda_handler(event, context):
              # The AgentCore Gateway invokes this Lambda with the TOOL ARGUMENTS as the
              # event itself — a plain dict such as {"restaurant_id": "r1"}. This is NOT
              # the old Bedrock Agents action-group envelope.
              print(f"tool={tool_name(context)} event={json.dumps(event)}")  # CloudWatch Logs

              restaurant_id = str((event or {}).get("restaurant_id") or "").strip()

              # Whatever this function returns is serialized back to the agent as the
              # tool result — no response envelope needed.
              return {
                  "restaurant_id": restaurant_id,
                  "available": AVAILABILITY.get(restaurant_id, False),
              }

  # ---------------------------------------------------------------------------
  # Role assumed by the AgentCore Gateway. The GATEWAY invokes the Lambdas with
  # this role — this replaces the old Bedrock Agents pattern of granting a
  # resource-based lambda permission to bedrock.amazonaws.com.
  # ---------------------------------------------------------------------------
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-gateway-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-tool-lambdas
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt GetCuisinesFunction.Arn
                  - !GetAtt SearchRestaurantsFunction.Arn
                  - !GetAtt GetAvailabilityFunction.Arn

  # ---------------------------------------------------------------------------
  # Execution role for the AgentCore managed harness (the agent itself):
  # model invocation, logging/metrics/tracing, workload identity, memory,
  # code interpreter, and — crucially for this exercise — InvokeGateway.
  # ---------------------------------------------------------------------------
  HarnessExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-harness-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: harness-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeBedrockModels
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub 'arn:aws:bedrock:us-east-1:${AWS::AccountId}:*'
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
              - Sid: ServiceTokens
                Effect: Allow
                Action:
                  - ecr-public:GetAuthorizationToken
                  - sts:GetServiceBearerToken
                Resource: '*'
              - Sid: Tracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
              - Sid: RuntimeLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*'
                  - !Sub 'arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*'
              - Sid: LogsAccountLevel
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:PutResourcePolicy
                Resource: !Sub 'arn:aws:logs:us-east-1:${AWS::AccountId}:*'
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: WorkloadIdentity
                Effect: Allow
                Action: bedrock-agentcore:GetWorkloadAccessToken*
                Resource: !Sub 'arn:aws:bedrock-agentcore:us-east-1:${AWS::AccountId}:workload-identity-directory/default*'
              - Sid: HarnessMemory
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:DeleteEvent
                  - bedrock-agentcore:RetrieveMemoryRecords
                Resource: !Sub 'arn:aws:bedrock-agentcore:us-east-1:${AWS::AccountId}:memory/*'
              - Sid: CodeInterpreter
                Effect: Allow
                Action:
                  - bedrock-agentcore:StartCodeInterpreterSession
                  - bedrock-agentcore:InvokeCodeInterpreter
                  - bedrock-agentcore:StopCodeInterpreterSession
                  - bedrock-agentcore:GetCodeInterpreterSession
                  - bedrock-agentcore:ListCodeInterpreterSessions
                Resource: arn:aws:bedrock-agentcore:us-east-1:aws:code-interpreter/*
              - Sid: InvokeGateway
                Effect: Allow
                Action: bedrock-agentcore:InvokeGateway
                Resource: !Sub 'arn:aws:bedrock-agentcore:us-east-1:${AWS::AccountId}:gateway/*'
              - Sid: MarketplaceModelAccess
                Effect: Allow
                Action:
                  - aws-marketplace:ViewSubscriptions
                  - aws-marketplace:Subscribe
                Resource: '*'

Outputs:
  GetCuisinesFunctionArn:
    Description: ARN of the get-cuisines Lambda function
    Value: !GetAtt GetCuisinesFunction.Arn

  SearchRestaurantsFunctionArn:
    Description: ARN of the search-restaurants Lambda function
    Value: !GetAtt SearchRestaurantsFunction.Arn

  GetAvailabilityFunctionArn:
    Description: ARN of the get-availability Lambda function
    Value: !GetAtt GetAvailabilityFunction.Arn

  GatewayRoleArn:
    Description: Role the AgentCore Gateway assumes to invoke the tool Lambdas
    Value: !GetAtt GatewayRole.Arn

  HarnessRoleArn:
    Description: Execution role for the AgentCore managed harness
    Value: !GetAtt HarnessExecutionRole.Arn
